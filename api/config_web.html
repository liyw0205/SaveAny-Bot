<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SaveAny-Bot 配置</title>
  <style>
    :root {
      --bg: #eef7ff;
      --panel: #ffffff;
      --panel-soft: #f7fbff;
      --line: #cfe4f7;
      --line-strong: #9fcdf0;
      --text: #102033;
      --muted: #5f7287;
      --accent: #229ed9;
      --accent-dark: #1687c2;
      --accent-soft: #e2f3ff;
      --danger: #d83b49;
      --danger-soft: #fff0f2;
      --ok: #168a55;
      --ok-soft: #e9f8f0;
      --warn: #b86b00;
      --warn-soft: #fff6e6;
      --shadow: 0 10px 28px rgba(34, 158, 217, .12);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { max-width: 100%; overflow-x: hidden; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    button, input, select, textarea { font: inherit; max-width: 100%; min-width: 0; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 236px minmax(0, 1fr); }
    aside { background: #ffffff; color: var(--text); padding: 18px 14px; position: sticky; top: 0; height: 100vh; border-right: 1px solid var(--line); }
    .brand { height: 44px; display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: 0; color: #0f77ad; }
    .mark { width: 30px; height: 30px; display: grid; place-items: center; background: var(--accent); border-radius: 8px; color: white; box-shadow: 0 6px 16px rgba(34, 158, 217, .24); }
    nav { display: grid; gap: 6px; margin-top: 20px; }
    nav button { width: 100%; border: 0; background: transparent; color: #425b72; text-align: left; padding: 10px 12px; border-radius: 8px; cursor: pointer; min-height: 40px; }
    nav button.active, nav button:hover { background: var(--accent-soft); color: #0c6f9e; }
    main { min-width: 0; }
    header { position: sticky; top: 0; z-index: 3; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 16px 22px; background: rgba(238, 247, 255, .92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
    header > div { min-width: 0; }
    h1 { margin: 0; font-size: 20px; line-height: 1.2; color: #0e5f8f; }
    .sub { display: block; max-width: 100%; margin-top: 4px; color: var(--muted); font-size: 13px; white-space: normal; overflow-wrap: anywhere; line-height: 1.45; }
    .actions, .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .actions { justify-content: flex-end; }
    .content { width: 100%; min-width: 0; padding: 22px; max-width: 1480px; }
    .grid { min-width: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: stretch; }
    .card-grid { min-width: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: stretch; }
    .grid > .panel, .card-grid > .storage, .card-grid > .user, .card-grid > .task-card, .card-grid > .empty { width: 100%; }
    .panel { min-width: 0; height: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; box-shadow: var(--shadow); }
    .panel h2 { margin: 0 0 14px; font-size: 16px; color: #124e73; }
    .panel h3 { margin: 0 0 10px; font-size: 14px; color: #124e73; }
    .panel-wide { grid-column: 1 / -1; }
    .row { min-width: 0; display: grid; grid-template-columns: minmax(100px, 150px) minmax(0, 1fr); gap: 10px; align-items: center; margin: 10px 0; }
    label { color: #36546e; font-size: 13px; }
    input, select, textarea { width: 100%; border: 1px solid #b9d8ef; background: white; color: var(--text); border-radius: 8px; padding: 8px 10px; min-height: 38px; outline-color: var(--accent); }
    input[type="checkbox"] { width: 18px; min-height: 18px; accent-color: var(--accent); }
    textarea { min-height: 92px; resize: vertical; }
    a { color: #0c84bd; }
    .toggle-row { display: flex; align-items: center; gap: 10px; }
    .btn { border: 1px solid #acd3ee; background: white; color: #14577f; border-radius: 8px; min-height: 38px; padding: 8px 12px; cursor: pointer; white-space: nowrap; }
    .btn:hover { border-color: var(--accent); color: #0b78ad; }
    .btn:disabled { cursor: wait; opacity: .68; }
    .primary { border-color: var(--accent); background: var(--accent); color: white; }
    .primary:hover { border-color: var(--accent-dark); background: var(--accent-dark); color: white; }
    .danger { border-color: #f4b9c0; background: var(--danger-soft); color: var(--danger); }
    .ghost { background: transparent; }
    .toolbar { margin-bottom: 14px; }
    .storage, .user, .rule, .task-card { min-width: 0; height: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 14px; background: var(--panel-soft); }
    .item-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; margin-bottom: 10px; }
    .item-title { min-width: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .item-title strong { min-width: 0; overflow-wrap: anywhere; }
    .badge { font-size: 12px; line-height: 1; padding: 5px 7px; border-radius: 999px; background: var(--accent-soft); color: #0b6f9f; border: 1px solid #b7dff7; }
    .badge.off { background: #f4f7fb; color: #6b7f93; border-color: #dce7f0; }
    .badge.warn { background: var(--warn-soft); color: var(--warn); border-color: #ffd99a; }
    .badge.ok { background: var(--ok-soft); color: var(--ok); border-color: #b8e7cf; }
    .split { min-width: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .checks { display: flex; gap: 8px 14px; flex-wrap: wrap; }
    .check { min-width: 0; display: inline-flex; align-items: center; gap: 6px; white-space: normal; overflow-wrap: anywhere; }
    .status { min-height: 22px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--danger); }
    .empty { color: var(--muted); border: 1px dashed #b6d5ed; border-radius: 8px; padding: 16px; background: #fff; }
    .auth-panel { display: none; max-width: 460px; margin: 8vh auto 0; }
    .auth-panel.show { display: block; }
    .auth-actions { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
    .app-content.hidden { display: none; }
    .raw-wrap { min-width: 0; max-width: 100%; overflow: hidden; }
    .raw { display: block; width: 100%; max-width: 100%; min-height: 460px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.45; }
    .rule-line, .task-line { min-width: 0; overflow-wrap: anywhere; word-break: break-word; line-height: 1.5; color: #35536d; }
    .notice { border: 1px solid #b7dff7; background: #eff8ff; color: #155d85; border-radius: 8px; padding: 12px; margin-bottom: 14px; overflow-wrap: anywhere; }
    .notice.warn { border-color: #ffd99a; background: var(--warn-soft); color: #7c4600; }
    .pill-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .pill { font-size: 12px; border-radius: 999px; border: 1px solid #b8d8ef; padding: 5px 8px; background: #fff; color: #2f5876; overflow-wrap: anywhere; }
    .log-view { display: block; width: 100%; max-height: 62vh; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; border: 1px solid #b9d8ef; background: #102033; color: #dff3ff; border-radius: 8px; padding: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.5; }
    .inline-field { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
    .progress { height: 9px; border-radius: 999px; background: #d9edf9; overflow: hidden; }
    .bar { height: 100%; width: 0; background: var(--accent); transition: width .2s ease; }
    .bar.upload { background: #38bdf8; }
    .progress-row { display: grid; gap: 6px; margin-top: 10px; }
    .task-page { min-width: 0; display: grid; gap: 14px; }
    .task-summary { min-width: 0; display: grid; grid-template-columns: minmax(320px, .9fr) minmax(0, 1.6fr); gap: 14px; align-items: stretch; }
    .stat-grid { min-width: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: stretch; }
    .stat-grid .panel { min-height: 126px; }
    .task-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
    .task-path-edit { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; width: 100%; margin-top: 10px; }
    .metric { display: grid; gap: 5px; }
    .metric strong { font-size: 22px; color: #0f6695; }
    .toast-host { position: fixed; right: 18px; bottom: 18px; z-index: 20; display: grid; gap: 8px; max-width: min(420px, calc(100vw - 36px)); }
    .toast { background: #ffffff; border: 1px solid var(--line-strong); color: #17415f; border-radius: 8px; padding: 10px 12px; box-shadow: var(--shadow); animation: toast-in .18s ease-out; overflow-wrap: anywhere; }
    .toast.err { border-color: #f0adb6; color: var(--danger); }
    .toast.ok { border-color: #a7dfc3; color: var(--ok); }
    @keyframes toast-in { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-backdrop { position: fixed; inset: 0; z-index: 15; display: none; place-items: center; background: rgba(12, 33, 54, .35); padding: 18px; }
    .modal-backdrop.show { display: grid; }
    .modal { width: min(620px, 100%); background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 24px 80px rgba(16, 32, 51, .22); padding: 18px; }
    .modal-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; margin-bottom: 12px; }
    .modal-head h2 { margin: 0; font-size: 17px; color: #124e73; }
    .nav-toggle, .nav-scrim { display: none; }
    .nav-toggle { width: 44px; height: 44px; border: 1px solid rgba(159, 205, 240, .72); border-radius: 12px; background: rgba(255, 255, 255, .66); color: #0e6f9f; box-shadow: 0 10px 28px rgba(34, 158, 217, .18); backdrop-filter: blur(14px); cursor: pointer; }
    .nav-toggle span { display: block; width: 18px; height: 2px; margin: 4px auto; border-radius: 999px; background: currentColor; transition: transform .18s ease, opacity .18s ease; }
    @media (max-width: 1280px) {
      .grid, .card-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .task-summary { grid-template-columns: 1fr; }
    }
    @media (min-width: 981px) {
      .card-grid { grid-auto-rows: 1fr; }
      .panel-wide { align-self: start; height: auto; }
    }
    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      aside { position: fixed; top: 68px; left: 0; z-index: 25; width: min(82vw, 300px); height: calc(100dvh - 68px); overflow-y: auto; padding-top: 18px; transform: translateX(-104%); transition: transform .2s ease; box-shadow: 18px 0 50px rgba(16, 32, 51, .18); border-top: 1px solid var(--line); }
      body.nav-open aside { transform: translateX(0); }
      nav { grid-template-columns: 1fr; }
      header { grid-template-columns: 1fr; padding-left: 72px; }
      .actions { justify-content: flex-start; }
      .grid, .card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .task-summary, .stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .row, .split { grid-template-columns: 1fr; gap: 6px; }
      .content { padding: 14px; }
      .nav-toggle { position: fixed; top: 12px; left: 12px; z-index: 30; display: grid; place-content: center; }
      body.nav-open .nav-toggle span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
      body.nav-open .nav-toggle span:nth-child(2) { opacity: 0; }
      body.nav-open .nav-toggle span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
      .nav-scrim { position: fixed; inset: 0; z-index: 20; background: rgba(12, 33, 54, .22); backdrop-filter: blur(2px); }
      body.nav-open .nav-scrim { display: block; }
    }
    @media (max-width: 640px) {
      nav, .grid, .card-grid, .task-summary, .stat-grid { grid-template-columns: 1fr; }
      .inline-field, .task-path-edit { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <button class="nav-toggle" id="nav-toggle" aria-label="切换导航" aria-expanded="false">
    <span></span>
    <span></span>
    <span></span>
  </button>
  <div class="nav-scrim" id="nav-scrim"></div>
  <div class="app">
    <aside>
      <div class="brand"><span class="mark">S</span><span>SaveAny-Bot</span></div>
      <nav id="nav"></nav>
    </aside>
    <main>
      <header>
        <div>
          <h1 id="title">配置</h1>
          <div class="sub" id="path">config.toml</div>
        </div>
        <div class="actions">
          <button class="btn" id="reload">刷新</button>
          <button class="btn primary" id="apply-runtime">应用(热载)</button>
        </div>
      </header>
      <div class="content">
        <section class="panel auth-panel" id="auth-panel">
          <h2>验证</h2>
          <div class="row"><label>API Token</label><input id="auth-token" type="password" autocomplete="current-password"></div>
          <div class="auth-actions">
            <button class="btn primary" id="auth-submit">进入</button>
            <button class="btn" id="auth-clear">清除</button>
          </div>
          <div class="status err" id="auth-status"></div>
        </section>
        <div class="app-content" id="app-content">
          <div class="status" id="status"></div>
          <div id="view"></div>
        </div>
      </div>
    </main>
  </div>
  <div class="toast-host" id="toast-host"></div>
  <div class="modal-backdrop" id="runtime-modal">
    <section class="modal">
      <div class="modal-head">
        <h2>应用结果</h2>
        <button class="btn" id="runtime-close">关闭</button>
      </div>
      <div id="runtime-body"></div>
    </section>
  </div>
  <script>
    const sections = [
      ["basic", "基础"],
      ["proxy", "代理"],
      ["features", "功能"],
      ["storages", "存储"],
      ["users", "用户"],
      ["rules", "规则"],
      ["tasks", "任务"],
      ["logs", "日志"],
      ["update", "更新"],
      ["advanced", "高级"],
      ["raw", "原始"]
    ];
    const state = {
      section: "basic",
      token: localStorage.getItem("saveany_api_token") || new URLSearchParams(location.search).get("token") || "",
      cfg: null,
      schema: null,
      rules: null,
      logs: [],
      updateInfo: null,
      runtime: null,
      selectedRuleUser: "",
      tasks: [],
      storages: [],
      taskTypes: [],
      saveTimer: null,
      saving: false,
      pendingSaveLabel: "",
      taskPoll: null,
      navOpen: false
    };

    const $ = (id) => document.getElementById(id);
    $("auth-token").value = state.token;

    function setStatus(message, kind) {
      $("status").textContent = message || "";
      $("status").className = "status " + (kind || "");
    }

    function showToast(message, kind) {
      const item = document.createElement("div");
      item.className = "toast " + (kind || "");
      item.textContent = message;
      $("toast-host").appendChild(item);
      setTimeout(() => item.remove(), 3200);
    }

    function setNavOpen(open) {
      state.navOpen = !!open;
      document.body.classList.toggle("nav-open", state.navOpen);
      $("nav-toggle").setAttribute("aria-expanded", state.navOpen ? "true" : "false");
    }

    function toggleNav() {
      setNavOpen(!state.navOpen);
    }

    function closeMobileNav() {
      if (window.matchMedia("(max-width: 980px)").matches) setNavOpen(false);
    }

    function headers(json) {
      const h = {};
      if (json) h["Content-Type"] = "application/json";
      if (state.token) h["Authorization"] = "Bearer " + state.token;
      return h;
    }

    async function request(path, options) {
      const res = await fetch(path, Object.assign({}, options || {}, { headers: Object.assign(headers(!!(options && options.body)), options && options.headers || {}) }));
      if (res.status === 401) {
        showAuth("Token 无效或已过期");
        throw new Error("unauthorized");
      }
      const text = await res.text();
      let data = {};
      if (text) {
        try { data = JSON.parse(text); } catch (e) { data = { message: text }; }
      }
      if (!res.ok) throw new Error(data.message || data.error || res.statusText);
      hideAuth();
      return data;
    }

    async function loadAll() {
      setStatus("加载中...");
      try {
        const schema = await request("/api/v1/config/schema");
        const configResp = await request("/api/v1/config");
        state.schema = schema;
        state.cfg = configResp.config;
        const configPath = configResp.path + (configResp.exists ? "" : " · 新建");
        $("path").textContent = configPath;
        setStatus(configResp.message || "已加载", "ok");
        await loadRules(false);
        if (state.section === "tasks") {
          await loadTaskMeta(false);
          await loadTasks(false);
        }
        render();
      } catch (err) {
        setStatus(err.message === "unauthorized" ? "等待 Token" : err.message, "err");
      }
    }

    async function loadRules(renderAfter) {
      try {
        state.rules = await request("/api/v1/config/rules");
      } catch (err) {
        state.rules = { users: [], storages: [], error: err.message };
      }
      if (renderAfter) render();
    }

    function saveAuthToken() {
      state.token = $("auth-token").value.trim();
      if (state.token) localStorage.setItem("saveany_api_token", state.token);
      else localStorage.removeItem("saveany_api_token");
    }

    function showAuth(message) {
      $("auth-panel").classList.add("show");
      $("app-content").classList.add("hidden");
      $("title").textContent = "验证";
      $("auth-status").textContent = message || "";
      setTimeout(() => $("auth-token").focus(), 0);
    }

    function hideAuth() {
      $("auth-panel").classList.remove("show");
      $("app-content").classList.remove("hidden");
      $("auth-status").textContent = "";
    }

    function scheduleSave(label) {
      if (!state.cfg) return;
      state.pendingSaveLabel = label || "配置";
      clearTimeout(state.saveTimer);
      setStatus("自动保存等待中...");
      state.saveTimer = setTimeout(() => saveConfig(state.pendingSaveLabel), 700);
    }

    async function saveConfig(label) {
      if (!state.cfg || state.saving) return;
      state.saving = true;
      try {
        readRawIfNeeded();
        await request("/api/v1/config", { method: "PUT", body: JSON.stringify(state.cfg) });
        setStatus("已自动保存", "ok");
        showToast("已保存 " + (label || "配置"), "ok");
      } catch (err) {
        setStatus(err.message, "err");
        showToast("保存失败: " + err.message, "err");
      } finally {
        state.saving = false;
      }
    }

    async function applyRuntime() {
      clearTimeout(state.saveTimer);
      await saveConfig(state.pendingSaveLabel || "配置");
      setStatus("正在应用配置...");
      try {
        const resp = await request("/api/v1/config/apply", { method: "POST" });
        state.runtime = resp.runtime || null;
        setStatus(resp.message || "配置已应用", "ok");
        showRuntimeModal(resp);
      } catch (err) {
        setStatus(err.message, "err");
        showToast("应用失败: " + err.message, "err");
      }
    }

    function showRuntimeModal(resp) {
      const runtime = resp.runtime || {};
      const reloadError = resp.reload_error ? "<div class=\"notice warn\">" + esc(resp.reload_error) + "</div>" : "";
      $("runtime-body").innerHTML = reloadError + renderRuntimeResult(runtime);
      $("runtime-modal").classList.add("show");
    }

    function renderRuntimeResult(runtime) {
      const applied = runtime.applied || [];
      const restart = runtime.restart_required || [];
      const warnings = runtime.warnings || [];
      return "<div class=\"notice " + (restart.length || warnings.length ? "warn" : "") + "\">" +
        "<strong>配置已应用</strong>" +
        (applied.length ? "<div class=\"pill-list\">" + applied.map((item) => "<span class=\"pill\">" + esc(item) + "</span>").join("") + "</div>" : "") +
        (restart.length ? "<div style=\"margin-top:10px\">需要重启</div><div class=\"pill-list\">" + restart.map((item) => "<span class=\"pill\">" + esc(item) + "</span>").join("") + "</div>" : "") +
        (warnings.length ? "<div style=\"margin-top:10px\">警告</div><div class=\"pill-list\">" + warnings.map((item) => "<span class=\"pill\">" + esc(item) + "</span>").join("") + "</div>" : "") +
      "</div>";
    }

    function renderNav() {
      $("nav").innerHTML = sections.map(([key, label]) => "<button data-section=\"" + key + "\" class=\"" + (state.section === key ? "active" : "") + "\">" + label + "</button>").join("");
      document.querySelectorAll("nav button").forEach((btn) => {
        btn.onclick = async () => {
          state.section = btn.dataset.section;
          closeMobileNav();
          render();
          if (state.section === "logs") loadLogs(true);
          if (state.section === "update" && !state.updateInfo) checkUpdate();
          if (state.section === "tasks") {
            await loadTaskMeta(false);
            await loadTasks(true);
          }
          syncTaskPolling();
        };
      });
    }

    function render() {
      renderNav();
      const active = sections.find((s) => s[0] === state.section);
      $("title").textContent = active ? active[1] : "配置";
      if (!state.cfg || !state.schema) return;
      const view = $("view");
      if (state.section === "basic") view.innerHTML = renderBasic();
      if (state.section === "proxy") view.innerHTML = renderProxy();
      if (state.section === "features") view.innerHTML = renderFeatures();
      if (state.section === "storages") view.innerHTML = renderStorages();
      if (state.section === "users") view.innerHTML = renderUsers();
      if (state.section === "rules") view.innerHTML = renderRules();
      if (state.section === "tasks") view.innerHTML = renderTasks();
      if (state.section === "logs") view.innerHTML = renderLogs();
      if (state.section === "update") view.innerHTML = renderUpdate();
      if (state.section === "advanced") view.innerHTML = renderAdvanced();
      if (state.section === "raw") view.innerHTML = renderRaw();
      bindInputs();
      syncTaskPolling();
    }

    function input(path, label, type, extra) {
      const value = get(path);
      if (type === "bool") {

    function renderStorage(storage, index) {
      const schema = schemaFor(storage.type);
      const fields = schema ? schema.fields.map((field) => storageField(storage, index, field)).join("") : "";
      const options = state.schema.storage_schemas.map((s) => "<option value=\"" + s.type + "\" " + (storage.type === s.type ? "selected" : "") + ">" + s.label + "</option>").join("");
      return "<div class=\"storage\">" +
        "<div class=\"item-head\"><div class=\"item-title\"><strong>" + esc(storage.name || "未命名") + "</strong><span class=\"badge " + (storage.enable ? "" : "off") + "\">" + esc(storage.type || "") + "</span></div><button class=\"btn danger\" data-delete-storage=\"" + index + "\">删除</button></div>" +
        "<div class=\"row\"><label>名称</label><input data-storage=\"" + index + "\" data-key=\"name\" data-label=\"存储名称\" type=\"text\" value=\"" + esc(storage.name || "") + "\"></div>" +
        "<div class=\"row\"><label>类型</label><select data-storage=\"" + index + "\" data-key=\"type\" data-label=\"存储类型\">" + options + "</select></div>" +
        "<div class=\"row\"><label>启用</label><div class=\"toggle-row\"><input data-storage=\"" + index + "\" data-key=\"enable\" data-label=\"存储启用\" type=\"checkbox\" " + (storage.enable ? "checked" : "") + "><span>" + (storage.enable ? "开启" : "关闭") + "</span></div></div>" +
        fields + "</div>";

    function storageField(storage, index, field) {
      const value = storage[field.name];
      if (field.type === "bool") {
        return "<div class=\"row\"><label>" + field.label + "</label><div class=\"toggle-row\"><input data-storage=\"" + index + "\" data-key=\"" + field.name + "\" data-label=\"" + esc(field.label) + "\" type=\"checkbox\" " + (value ? "checked" : "") + "><span>" + (value ? "开启" : "关闭") + "</span></div></div>";
      }
      if (field.type === "string_list") {
        return "<div class=\"row\"><label>" + field.label + "</label><textarea data-storage=\"" + index + "\" data-key=\"" + field.name + "\" data-label=\"" + esc(field.label) + "\" data-list=\"1\" placeholder=\"" + esc(field.placeholder || "") + "\">" + esc(Array.isArray(value) ? value.join("\n") : (value || "")) + "</textarea></div>";
      }
      const type = field.type === "password" ? "password" : field.type === "int" ? "number" : "text";
      return "<div class=\"row\"><label>" + field.label + (field.required ? " *" : "") + "</label><input data-storage=\"" + index + "\" data-key=\"" + field.name + "\" data-label=\"" + esc(field.label) + "\" type=\"" + type + "\" value=\"" + esc(value == null ? "" : value) + "\" placeholder=\"" + esc(field.placeholder || "") + "\"></div>";
    }

            panel("失败", "<div class=\"metric\"><strong>" + failed + "</strong><span class=\"sub\">可重试</span></div>") +
            panel("已完成", "<div class=\"metric\"><strong>" + done + "</strong><span class=\"sub\">历史记录</span></div>") +
          "</div>" +
        "</div>" +

    function renderTransferForm() {
      const options = storageOptions();
      return "<div class=\"row\"><label>源存储</label><select id=\"task-source-storage\">" + options + "</select></div>" +
        "<div class=\"row\"><label>源路径</label><input id=\"task-source-path\" type=\"text\" placeholder=\"/downloads\"></div>" +
        "<div class=\"row\"><label>目标存储</label><select id=\"task-target-storage\">" + options + "</select></div>" +
        "<div class=\"row\"><label>转存路径</label><input id=\"task-target-path\" type=\"text\" placeholder=\"/saved\"></div>" +
        "<button class=\"btn primary\" id=\"create-transfer-task\">新增任务</button>";
    }

    function renderTaskCard(task) {
      const phase = phaseLabel(task.phase || task.status);
      const badgeClass = task.status === "completed" ? "ok" : task.status === "failed" ? "warn" : task.status === "running" ? "" : "off";
      const progress = renderTaskProgress(task);
      const line = task.type === "transfer"
        ? esc((task.source_storage || "") + ":" + (task.source_path || "") + " > " + (task.target_storage || task.storage || "") + ":" + (task.target_path || task.path || ""))
        : esc((task.storage || "") + ":" + (task.path || ""));
      const canRetry = ["failed", "cancelled", "paused"].includes(task.status);
      const canPause = ["queued", "running"].includes(task.status);
      const pathEdit = task.type === "transfer" && canPause
        ? "<div class=\"task-path-edit\"><input data-task-path-input=\"" + esc(task.task_id) + "\" type=\"text\" value=\"" + esc(task.target_path || task.path || "") + "\"><button class=\"btn\" data-task-path=\"" + esc(task.task_id) + "\">修改路径</button></div>"
        : "";
      return "<div class=\"task-card\">" +
        "<div class=\"item-head\"><div class=\"item-title\"><strong>" + esc(task.title || task.task_id) + "</strong><span class=\"badge " + badgeClass + "\">" + statusLabel(task.status) + "</span></div><span class=\"badge\">" + esc(task.type) + "</span></div>" +
        "<div class=\"task-line\">" + line + "</div>" +
        "<div class=\"sub\">" + phase + (task.error ? " · " + esc(task.error) : "") + "</div>" +
        progress + pathEdit +
        "<div class=\"task-actions\">" +
          (canPause ? "<button class=\"btn\" data-task-pause=\"" + esc(task.task_id) + "\">暂停</button>" : "") +
          (canRetry ? "<button class=\"btn primary\" data-task-retry=\"" + esc(task.task_id) + "\">重试</button>" : "") +
          "<button class=\"btn danger\" data-task-delete=\"" + esc(task.task_id) + "\">删除</button>" +
        "</div>" +
      "</div>";
    }

    function renderTaskProgress(task) {
      const progress = task.progress || {};
      const total = progress.total_bytes || 0;
      if (!total) return "";
      const down = progress.downloaded_bytes || 0;
      const up = progress.uploaded_bytes || 0;
      return "<div class=\"progress-row\">" +
        "<span class=\"sub\">下载 " + formatBytes(down) + " / " + formatBytes(total) + "</span><div class=\"progress\"><div class=\"bar\" style=\"width:" + pct(down, total) + "%\"></div></div>" +
        "<span class=\"sub\">上传 " + formatBytes(up) + " / " + formatBytes(total) + "</span><div class=\"progress\"><div class=\"bar upload\" style=\"width:" + pct(up, total) + "%\"></div></div>" +
      "</div>";
    }

        panel("缓存", input("cache.ttl", "TTL", "int") + input("cache.num_counters", "计数器", "int") + input("cache.max_cost", "最大成本", "int")) +
        panel("路径", input("temp.base_path", "临时目录", "text") + input("db.path", "数据库", "text") + input("db.session", "Session DB", "text")) +
        panel("Hook", input("hook.exec.task_before_start", "开始前", "text") + input("hook.exec.task_success", "成功", "text") + input("hook.exec.task_fail", "失败", "text") + input("hook.exec.task_cancel", "取消", "text")) +

    function renderRaw() {
      return panel("JSON", "<div class=\"raw-wrap\"><textarea class=\"raw\" id=\"raw-json\" wrap=\"soft\" spellcheck=\"false\">" + esc(JSON.stringify(state.cfg, null, 2)) + "</textarea></div><div class=\"toolbar\"><button class=\"btn\" id=\"apply-raw\">应用 JSON</button></div>", "panel-wide");
    }

    function panel(title, body, cls) {
      return "<section class=\"panel " + (cls || "") + "\"><h2>" + title + "</h2>" + body + "</section>";
    }

    function bindInputs() {
      document.querySelectorAll("[data-path]").forEach((el) => {
        el.onchange = el.oninput = () => {
          set(el.dataset.path, readValue(el));
          updateToggleLabel(el);
          scheduleSave(el.dataset.label);
        };
      });
      document.querySelectorAll("[data-storage]").forEach((el) => {
        el.onchange = el.oninput = () => {
          const storage = state.cfg.storages[Number(el.dataset.storage)];
          const oldName = storage.name || "";
          storage[el.dataset.key] = readValue(el);
          if (el.dataset.key === "name") syncStorageRename(oldName, storage.name || "");
          if (el.dataset.key === "type") applyStorageDefaults(storage);
          updateToggleLabel(el);
          scheduleSave(el.dataset.label);
          if (el.dataset.key === "type") render();
        };
      });
      document.querySelectorAll("[data-delete-storage]").forEach((btn) => {
        btn.onclick = () => {
          const storage = state.cfg.storages[Number(btn.dataset.deleteStorage)];
          state.cfg.storages.splice(Number(btn.dataset.deleteStorage), 1);
          cleanupStorageReferences(storage && storage.name);
          render();
          scheduleSave("存储");
        };
      });
      const addStorage = $("add-storage");
      if (addStorage) addStorage.onclick = () => {
        const type = $("new-storage-type").value;
        state.cfg.storages = state.cfg.storages || [];
        state.cfg.storages.push(defaultStorage(type));
        cleanupAllStorageReferences();
        render();
        scheduleSave("存储");
      };
      document.querySelectorAll("[data-user]").forEach((el) => {
        el.onchange = el.oninput = () => {
          const user = state.cfg.users[Number(el.dataset.user)];
          user[el.dataset.key] = el.dataset.key === "blacklist" ? el.value === "true" : readValue(el);
          cleanupUserStorages(user);
          scheduleSave(el.dataset.label);
        };
      });
      document.querySelectorAll("[data-user-storage]").forEach((el) => {
        el.onchange = () => {
          const index = Number(el.dataset.userStorage);
          state.cfg.users[index].storages = Array.from(document.querySelectorAll("[data-user-storage=\"" + index + "\"]:checked")).map((item) => item.value);
          cleanupUserStorages(state.cfg.users[index]);
          scheduleSave("用户存储");
        };
      });
      document.querySelectorAll("[data-delete-user]").forEach((btn) => {
        btn.onclick = () => { state.cfg.users.splice(Number(btn.dataset.deleteUser), 1); render(); scheduleSave("用户"); };
      });
      const addUser = $("add-user");
      if (addUser) addUser.onclick = () => { state.cfg.users = state.cfg.users || []; state.cfg.users.push({ id: 0, storages: [], blacklist: true }); render(); scheduleSave("用户"); };
      const ruleUser = $("rule-user");
      if (ruleUser) ruleUser.onchange = () => { state.selectedRuleUser = ruleUser.value; render(); };
      const ruleApply = $("rule-apply");
      if (ruleApply) ruleApply.onchange = updateRuleMode;
      const addRule = $("add-rule");
      if (addRule) addRule.onclick = createRule;
      document.querySelectorAll("[data-delete-rule]").forEach((btn) => {
        btn.onclick = () => deleteRule(btn.dataset.deleteRule);
      });
      const applyRaw = $("apply-raw");
      if (applyRaw) applyRaw.onclick = () => {
        try {
          state.cfg = JSON.parse($("raw-json").value);
          state.section = "basic";
          render();
          scheduleSave("JSON");
        } catch (err) {
          setStatus(err.message, "err");
        }
      };
      document.querySelectorAll("[data-test-proxy]").forEach((btn) => {
        btn.onclick = () => testProxy(btn.dataset.testProxy, btn);
      });
      const refreshLogs = $("refresh-logs");
      if (refreshLogs) refreshLogs.onclick = () => loadLogs(true);
      const checkUpdateBtn = $("check-update");
      if (checkUpdateBtn) checkUpdateBtn.onclick = checkUpdate;
      const refreshTasks = $("refresh-tasks");
      if (refreshTasks) refreshTasks.onclick = () => loadTasks(true);
      const createTransfer = $("create-transfer-task");
      if (createTransfer) createTransfer.onclick = createTransferTask;
      document.querySelectorAll("[data-task-pause]").forEach((btn) => btn.onclick = () => pauseTask(btn.dataset.taskPause));
      document.querySelectorAll("[data-task-retry]").forEach((btn) => btn.onclick = () => retryTask(btn.dataset.taskRetry));
      document.querySelectorAll("[data-task-delete]").forEach((btn) => btn.onclick = () => deleteTask(btn.dataset.taskDelete));
      document.querySelectorAll("[data-task-path]").forEach((btn) => btn.onclick = () => updateTaskPath(btn.dataset.taskPath));
    }

    function updateToggleLabel(el) {
      if (el.type === "checkbox" && el.nextElementSibling) {
        el.nextElementSibling.textContent = el.checked ? "开启" : "关闭";
      }
    }

    function readRawIfNeeded() {
      if (state.section !== "raw" || !$("raw-json")) return;
      state.cfg = JSON.parse($("raw-json").value);
    }

    function readValue(el) {
      if (el.type === "checkbox") return el.checked;
      if (el.type === "number") return el.value === "" ? 0 : Number(el.value);
      if (el.dataset.list) return el.value.split(/\n|,/).map((item) => item.trim()).filter(Boolean);
      return el.value;
    }

    function defaultStorage(type) {
      const schema = schemaFor(type);
      const storage = { name: type + "-" + ((state.cfg.storages || []).length + 1), type: type, enable: true };
      if (schema) {
        schema.fields.forEach((field) => {
          if (field.type === "bool") storage[field.name] = false;
          else if (field.type === "int") storage[field.name] = 0;
          else if (field.type === "string_list") storage[field.name] = [];
          else storage[field.name] = "";
        });
      }
      applyStorageDefaults(storage);
      return storage;
    }

    function applyStorageDefaults(storage) {
      if (!storage) return;
      if (storage.base_path == null || String(storage.base_path).trim() === "") {
        const path = defaultStoragePath(storage.type);
        if (path) storage.base_path = path;
      }
    }

    function defaultStoragePath(type) {
      if (type === "local") return "./downloads";
      if (type === "webdav" || type === "alist" || type === "rclone") return "/telegram";
      if (type === "minio" || type === "s3") return "telegram";
      return "";
    }

    function storageNameSet() {
      const set = new Set();
      (state.cfg.storages || []).forEach((storage) => {
        const name = String(storage.name || "").trim();
        if (name) set.add(name);
      });
      return set;
    }

    function cleanupUserStorages(user) {
      if (!user) return;
      const names = storageNameSet();
      const seen = new Set();
      user.storages = (user.storages || []).map((name) => String(name || "").trim()).filter((name) => {
        if (!name || !names.has(name) || seen.has(name)) return false;
        seen.add(name);
        return true;
      });
    }

    function cleanupAllStorageReferences() {
      (state.cfg.users || []).forEach(cleanupUserStorages);
    }

    function cleanupStorageReferences(name) {
      if (!name) {
        cleanupAllStorageReferences();
        return;
      }
      (state.cfg.users || []).forEach((user) => {
        user.storages = (user.storages || []).filter((storageName) => storageName !== name);
      });
      cleanupAllStorageReferences();
      if (state.rules) {
        state.rules.storages = (state.rules.storages || []).filter((storageName) => storageName !== name);
        (state.rules.users || []).forEach((user) => {
          (user.rules || []).forEach((rule) => {
            if (rule.storage_name === name) rule.storage_name = "CHOSEN";
          });
          if (user.default_storage === name) {
            user.default_storage = "";
            user.default_dir = 0;
          }
        });
      }
    }

    function syncStorageRename(oldName, newName) {
      oldName = String(oldName || "").trim();
      newName = String(newName || "").trim();
      if (!oldName || !newName || oldName === newName) {
        cleanupAllStorageReferences();
        return;
      }
      (state.cfg.users || []).forEach((user) => {
        user.storages = (user.storages || []).map((name) => name === oldName ? newName : name);
        cleanupUserStorages(user);
      });
      if (state.rules) {
        state.rules.storages = (state.rules.storages || []).map((name) => name === oldName ? newName : name);
        (state.rules.users || []).forEach((user) => {
          (user.rules || []).forEach((rule) => {
            if (rule.storage_name === oldName) rule.storage_name = newName;
          });
          if (user.default_storage === oldName) user.default_storage = newName;
        });
      }
    }

    function schemaFor(type) {
      return (state.schema.storage_schemas || []).find((schema) => schema.type === type);
    }

    async function updateRuleMode() {
      try {
        await request("/api/v1/config/rules/apply", {
          method: "PUT",
          body: JSON.stringify({ chat_id: Number(state.selectedRuleUser), apply_rule: $("rule-apply").checked })
        });
        await loadRules(true);
        showToast("规则开关已保存", "ok");
      } catch (err) {
        setStatus(err.message, "err");
      }
    }

    async function createRule() {
      try {
        await request("/api/v1/config/rules", {
          method: "POST",
          body: JSON.stringify({
            chat_id: Number(state.selectedRuleUser),
            type: $("rule-type").value,
            data: $("rule-data").value,
            storage_name: $("rule-storage").value,
            dir_path: $("rule-dir").value
          })
        });
        await loadRules(true);
        showToast("规则已新增", "ok");
      } catch (err) {
        setStatus(err.message, "err");
      }
    }

    async function deleteRule(id) {
      try {
        await request("/api/v1/config/rules/" + id, { method: "DELETE" });
        await loadRules(true);
        showToast("规则已删除", "ok");
      } catch (err) {
        setStatus(err.message, "err");
      }
    }

    async function testProxy(path, btn) {
      const url = get(path);
      const oldText = btn ? btn.textContent : "";
      if (btn) {
        btn.disabled = true;
        btn.setAttribute("aria-busy", "true");
        btn.textContent = "正在测试";
      }
      if (!url) {
        showToast("代理地址为空", "err");
        if (btn) {
          btn.disabled = false;
          btn.removeAttribute("aria-busy");
          btn.textContent = oldText;
        }
        return;
      }
      try {
        const resp = await request("/api/v1/config/proxy-test", { method: "POST", body: JSON.stringify({ url }) });
        if (resp.ok) showToast("代理可用 " + resp.ms + "ms", "ok");
        else showToast("代理不可用 " + (resp.ms ? resp.ms + "ms · " : "") + (resp.message || ""), "err");
      } catch (err) {
        showToast("测试失败: " + err.message, "err");
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.removeAttribute("aria-busy");
          btn.textContent = oldText;
        }
      }
    }

    async function loadLogs(renderAfter) {
      try {
        const resp = await request("/api/v1/config/logs?limit=300");
        state.logs = resp.lines || [];
        if (renderAfter) render();
      } catch (err) {
        setStatus(err.message, "err");
      }
    }

    async function checkUpdate() {
      setStatus("正在检测更新...");
      try {
        state.updateInfo = await request("/api/v1/config/update-check");
        setStatus(state.updateInfo.has_update ? "发现新版本" : "更新检测完成", state.updateInfo.has_update ? "" : "ok");
        render();
      } catch (err) {
        setStatus(err.message, "err");
      }
    }

    async function loadTaskMeta(renderAfter) {
      try {
        const [storages, types] = await Promise.all([
          request("/api/v1/storages"),
          request("/api/v1/task-types")
        ]);
        state.storages = storages.storages || [];
        state.taskTypes = types.types || [];
        if (renderAfter) render();
      } catch (err) {
        setStatus(err.message, "err");
      }
    }

    async function loadTasks(renderAfter) {
      try {
        const resp = await request("/api/v1/tasks");
        state.tasks = resp.tasks || [];
        if (renderAfter) render();
      } catch (err) {
        setStatus(err.message, "err");
      }
    }

    function syncTaskPolling() {
      if (state.section !== "tasks") {
        if (state.taskPoll) clearInterval(state.taskPoll);
        state.taskPoll = null;
        return;
      }
      if (!state.taskPoll) {
        state.taskPoll = setInterval(() => loadTasks(true), 2000);
      }
    }

    async function createTransferTask() {
      const sourceStorage = $("task-source-storage").value;
      const sourcePath = $("task-source-path").value.trim();
      const targetStorage = $("task-target-storage").value;
      const targetPath = $("task-target-path").value.trim();
      if (!sourceStorage || !targetStorage || !sourcePath || !targetPath) {
        showToast("转存参数不完整", "err");
        return;
      }
      try {
        await request("/api/v1/tasks", {
          method: "POST",
          body: JSON.stringify({
            type: "transfer",
            storage: targetStorage,
            path: targetPath,
            params: {
              source_storage: sourceStorage,
              source_path: sourcePath,
              target_storage: targetStorage,
              target_path: targetPath
            }
          })
        });
        showToast("任务已新增", "ok");
        await loadTasks(true);
      } catch (err) {
        showToast("新增失败: " + err.message, "err");
      }
    }

    async function pauseTask(id) {
      try {
        await request("/api/v1/tasks/" + encodeURIComponent(id) + "/pause", { method: "POST" });
        showToast("任务已暂停", "ok");
        await loadTasks(true);
      } catch (err) {
        showToast("暂停失败: " + err.message, "err");
      }
    }

    async function retryTask(id) {
      try {
        await request("/api/v1/tasks/" + encodeURIComponent(id) + "/retry", { method: "POST" });
        showToast("任务已重试", "ok");
        await loadTasks(true);
      } catch (err) {
        showToast("重试失败: " + err.message, "err");
      }
    }

    async function deleteTask(id) {
      try {
        await request("/api/v1/tasks/" + encodeURIComponent(id) + "?record=1", { method: "DELETE" });
        showToast("任务已删除", "ok");
        await loadTasks(true);
      } catch (err) {
        showToast("删除失败: " + err.message, "err");
      }
    }

    async function updateTaskPath(id) {
      const input = document.querySelector("[data-task-path-input=\"" + cssEscape(id) + "\"]");
      const path = input ? input.value.trim() : "";
      if (!path) {
        showToast("路径为空", "err");
        return;
      }
      try {
        await request("/api/v1/tasks/" + encodeURIComponent(id) + "/path", { method: "PUT", body: JSON.stringify({ path }) });
        showToast("转存路径已修改", "ok");
        await loadTasks(true);
      } catch (err) {
        showToast("修改失败: " + err.message, "err");
      }
    }

    function storageOptions() {
      const names = (state.storages || []).map((storage) => storage.name).filter(Boolean);
      const fallback = (state.cfg.storages || []).map((storage) => storage.name).filter(Boolean);
      return (names.length ? names : fallback).map((name) => "<option value=\"" + esc(name) + "\">" + esc(name) + "</option>").join("");
    }

    function statusLabel(status) {
      return ({ queued: "排队", running: "运行", paused: "已暂停", completed: "完成", failed: "失败", cancelled: "取消" }[status]) || status;
    }

    function phaseLabel(phase) {
      return ({ queued: "排队中", running: "运行中", downloading: "下载中", uploading: "上传中", paused: "已暂停", completed: "已完成", failed: "失败", cancelled: "已取消" }[phase]) || phase;
    }

    function formatBytes(bytes) {
      if (!bytes || bytes < 0) return "0 B";
      const units = ["B", "KB", "MB", "GB", "TB"];
      let value = bytes;
      let idx = 0;
      while (value >= 1024 && idx < units.length - 1) {
        value /= 1024;
        idx++;
      }
      return value.toFixed(idx === 0 ? 0 : 1) + " " + units[idx];
    }

    function pct(value, total) {
      if (!total) return 0;
      return Math.max(0, Math.min(100, (value * 100 / total))).toFixed(1);
    }

    function get(path) {
      return path.split(".").reduce((obj, key) => obj && obj[key], state.cfg);
    }

    function set(path, value) {
      const parts = path.split(".");
      let obj = state.cfg;
      parts.slice(0, -1).forEach((key) => {
        if (!obj[key]) obj[key] = {};
        obj = obj[key];
      });
      obj[parts[parts.length - 1]] = value;
    }

    function cssEscape(value) {
      if (window.CSS && CSS.escape) return CSS.escape(value);
      return String(value).replace(/["\\]/g, "\\$&");
    }

    function esc(value) {
      return String(value).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
    }

    $("reload").onclick = loadAll;
    $("apply-runtime").onclick = applyRuntime;
    $("nav-toggle").onclick = toggleNav;
    $("nav-scrim").onclick = () => setNavOpen(false);
    $("runtime-close").onclick = () => $("runtime-modal").classList.remove("show");
    $("runtime-modal").onclick = (event) => {
      if (event.target === $("runtime-modal")) $("runtime-modal").classList.remove("show");
    };
    $("auth-submit").onclick = () => {
      saveAuthToken();
      loadAll();
    };
    $("auth-clear").onclick = () => {
      $("auth-token").value = "";
      saveAuthToken();
      showAuth("");
    };
    $("auth-token").onkeydown = (event) => {
      if (event.key === "Enter") {
        saveAuthToken();
        loadAll();
      }
    };
    renderNav();
    loadAll();
  </script>
</body>
</html>
